name: Generate dependency lockfiles

on:
  push:
    branches:
      - build/dependency-lockfiles

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/dependency-lockfiles
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: pdo_pgsql, pdo_mysql
          tools: composer:v2
          ini-values: variables_order=EGPCS

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate PHP lock and Flex recipe state
        run: |
          composer update --no-interaction --prefer-dist --no-progress --no-audit
          test -s composer.lock
          test -s symfony.lock

          if composer show 'symfony/*' | grep -E '^[^ ]+[[:space:]]+v8\.'; then
            echo "Unexpected Symfony 8 component resolved; intended runtime family is Symfony 7.4."
            exit 1
          fi

          # Keep only generated lock state; recipe defaults must not rewrite
          # Mediarama's reviewed runtime configuration.
          git restore --worktree --staged .
          test -s composer.lock
          test -s symfony.lock

          rm -rf vendor
          composer install --no-interaction --prefer-dist --no-progress --no-audit
          git diff --exit-code -- .env config
          composer validate --strict

      - name: Generate and verify npm lock
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -s package-lock.json
          rm -rf node_modules
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Commit generated lockfiles
        run: |
          git add composer.lock symfony.lock package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency lockfiles already match."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: lock PHP and frontend dependencies (#39)"
          git push origin HEAD:build/dependency-lockfiles
