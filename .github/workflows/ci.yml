name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP validate and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y exiftool imagemagick

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Lint PHP
        run: find src tests migrations -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate service configuration
        run: php bin/console lint:yaml config --parse-tags

      - name: Validate routes
        run: php bin/console debug:router --show-controllers

      - name: Run unit tests
        run: vendor/bin/phpunit
