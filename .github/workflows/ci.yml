name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP validate and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: mediarama
          POSTGRES_USER: mediarama
          POSTGRES_PASSWORD: mediarama
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mediarama -d mediarama"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: coppermine
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    env:
      APP_ENV: test
      APP_DEBUG: 0
      APP_SECRET: mediarama-ci-only
      DATABASE_URL: postgresql://mediarama:mediarama@127.0.0.1:5432/mediarama?serverVersion=18&charset=utf8
      MESSENGER_TRANSPORT_DSN: doctrine://default?queue_name=async&auto_setup=false
      MEDIA_STORAGE_PATH: /tmp/mediarama-media
      EXIFTOOL_BINARY: exiftool
      IMAGEMAGICK_BINARY: convert
      IMAGEMAGICK_IDENTIFY_BINARY: identify
      UPLOAD_MAX_ASSET_BYTES: 2147483648
      UPLOAD_MAX_CHUNK_BYTES: 16777216
      COPPERMINE_DATABASE_URL: mysql://readonly:readonly@127.0.0.1:3306/coppermine
      COPPERMINE_TABLE_PREFIX: cpg_
      COPPERMINE_ALBUMS_ROOT: /tmp/coppermine-albums

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: pdo_pgsql, pdo_mysql
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y exiftool imagemagick mariadb-client

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Build UIkit frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -s public/build/app.css
          test -s public/build/uikit.min.js
          test -s public/build/uikit-icons.min.js

      - name: Lint PHP
        run: find src tests migrations -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate YAML syntax without booting the application
        run: |
          php -r '
          require "vendor/autoload.php";
          foreach (glob("config/*.yaml") as $file) { Symfony\Component\Yaml\Yaml::parseFile($file, Symfony\Component\Yaml\Yaml::PARSE_CUSTOM_TAGS); echo "OK $file\n"; }
          foreach (glob("config/packages/*.yaml") as $file) { Symfony\Component\Yaml\Yaml::parseFile($file, Symfony\Component\Yaml\Yaml::PARSE_CUSTOM_TAGS); echo "OK $file\n"; }
          '

      - name: Validate Symfony container
        run: php bin/console lint:container

      - name: Validate routes
        run: php bin/console debug:router --show-controllers

      - name: Run PostgreSQL migrations
        run: php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration

      - name: Show migration status
        run: php bin/console doctrine:migrations:status

      - name: Run unit tests
        run: vendor/bin/phpunit

      - name: Prepare Coppermine 1.6 fixture
        run: |
          mkdir -p /tmp/coppermine-albums/userpics
          convert -size 2x2 xc:white /tmp/coppermine-albums/userpics/sample.jpg
          convert -size 2x2 xc:white /tmp/coppermine-albums/userpics/sample2.jpg

          exiftool -overwrite_original \
            '-IFD0:Make=Fixture Camera Co' \
            '-IFD0:Model=FixtureCam 1' \
            '-ExifIFD:DateTimeOriginal=2024:01:02 10:30:00' \
            '-ExifIFD:LensModel=Fixture 35mm' \
            '-ExifIFD:ISO=400' \
            '-ExifIFD:FNumber=2.8' \
            '-ExifIFD:ExposureTime=0.008' \
            '-ExifIFD:FocalLength=35' \
            '-GPS:GPSLatitude=48.2082' \
            '-GPS:GPSLatitudeRef=N' \
            '-GPS:GPSLongitude=16.3738' \
            '-GPS:GPSLongitudeRef=E' \
            '-XMP-dc:Title=Embedded fixture title' \
            '-XMP-dc:Description=Embedded fixture description' \
            '-XMP-dc:Creator=Fixture Photographer' \
            '-XMP-dc:Rights=Fixture Copyright' \
            '-XMP-dc:Subject=portrait' \
            '-XMP-dc:Subject+=vienna' \
            '-XMP-iptcCore:Location=Vienna Fixture' \
            /tmp/coppermine-albums/userpics/sample.jpg

          exiftool -overwrite_original \
            '-IPTC:DateCreated=2024:03:05' \
            '-IPTC:ObjectName=IPTC embedded title' \
            '-IPTC:Caption-Abstract=IPTC embedded description' \
            '-IPTC:By-line=IPTC Creator' \
            '-IPTC:CopyrightNotice=IPTC Copyright' \
            '-IPTC:Sub-location=IPTC Vienna' \
            '-IPTC:Keywords=archive' \
            '-IPTC:Keywords+=vienna' \
            /tmp/coppermine-albums/userpics/sample2.jpg

          exiftool -json -struct -G1:4 -a -n -- /tmp/coppermine-albums/userpics/sample.jpg > /tmp/coppermine-rich-metadata.json
          php <<'PHP'
          <?php
          $decoded = json_decode((string) file_get_contents('/tmp/coppermine-rich-metadata.json'), true, flags: JSON_THROW_ON_ERROR);
          $raw = $decoded[0] ?? [];
          foreach ([
              'IFD0:Make',
              'IFD0:Model',
              'ExifIFD:DateTimeOriginal',
              'ExifIFD:ISO',
              'ExifIFD:LensModel',
              'XMP-dc:Title',
              'XMP-dc:Creator',
              'XMP-dc:Subject',
              'XMP-iptcCore:Location',
          ] as $key) {
              if (!array_key_exists($key, $raw)) {
                  fwrite(STDERR, 'Missing expected ExifTool family-1 key: '.$key.PHP_EOL);
                  exit(1);
              }
          }
          PHP

          cp tests/Fixtures/Coppermine/media/sample.mp3 /tmp/coppermine-albums/userpics/sample.mp3
          cp tests/Fixtures/Coppermine/media/sample.mp4 /tmp/coppermine-albums/userpics/sample.mp4
          mariadb --host=127.0.0.1 --port=3306 --user=root --password=root coppermine \
            < tests/Fixtures/Coppermine/1.6-minimal.sql
          mariadb --host=127.0.0.1 --port=3306 --user=root --password=root \
            -e "CREATE USER IF NOT EXISTS 'readonly'@'%' IDENTIFIED BY 'readonly'; GRANT SELECT ON coppermine.* TO 'readonly'@'%'; FLUSH PRIVILEGES;"

      - name: Run end-to-end Coppermine migration
        run: php bin/console mediarama:import:coppermine

      - name: Process imported media asynchronously
        run: php bin/console messenger:consume async --limit=4 --time-limit=30 --no-interaction -vv

      - name: Verify migrated fixture
        run: |
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';

          $dsn = new Doctrine\DBAL\Tools\DsnParser([
              'postgresql' => 'pdo_pgsql',
              'postgres' => 'pdo_pgsql',
          ]);
          $db = Doctrine\DBAL\DriverManager::getConnection($dsn->parse((string) getenv('DATABASE_URL')));
          $checks = [
              'ready media' => (int) $db->fetchOne("SELECT COUNT(*) FROM media_assets WHERE processing_state = 'ready'") === 4,
              'ready audio media' => (int) $db->fetchOne("SELECT COUNT(*) FROM media_assets WHERE original_filename = 'sample.mp3' AND mime_type = 'audio/mpeg' AND media_type = 'audio' AND processing_state = 'ready'") === 1,
              'ready video media' => (int) $db->fetchOne("SELECT COUNT(*) FROM media_assets WHERE original_filename = 'sample.mp4' AND mime_type = 'video/mp4' AND media_type = 'video' AND processing_state = 'ready'") === 1,
              'Coppermine title and description beat embedded values' => (int) $db->fetchOne("SELECT COUNT(*) FROM media_assets WHERE original_filename = 'sample.jpg' AND title = 'Fixture Photo' AND description = 'Imported fixture caption' AND metadata_provenance->>'title' = 'coppermine_import' AND metadata_provenance->>'description' = 'coppermine_import'") === 1,
              'embedded EXIF and XMP seed canonical metadata' => (int) $db->fetchOne("SELECT COUNT(*) FROM media_assets WHERE original_filename = 'sample.jpg' AND creator = 'Fixture Photographer' AND copyright = 'Fixture Copyright' AND camera_make = 'Fixture Camera Co' AND camera_model = 'FixtureCam 1' AND lens = 'Fixture 35mm' AND iso = 400 AND location_name = 'Vienna Fixture' AND ABS(latitude - 48.2082) < 0.000001 AND ABS(longitude - 16.3738) < 0.000001 AND captured_at IS NOT NULL") === 1,
              'embedded metadata provenance' => (int) $db->fetchOne("SELECT COUNT(*) FROM media_assets WHERE original_filename = 'sample.jpg' AND metadata_provenance->>'creator' = 'embedded' AND metadata_provenance->>'camera_make' = 'embedded' AND metadata_provenance->>'captured_at' = 'embedded' AND metadata_provenance->>'latitude' = 'embedded'") === 1,
              'qualified EXIF and XMP snapshot keys' => (int) $db->fetchOne("SELECT COUNT(*) FROM media_assets WHERE original_filename = 'sample.jpg' AND jsonb_exists(metadata->'exif', 'IFD0:Make') AND jsonb_exists(metadata->'exif', 'ExifIFD:ISO') AND jsonb_exists(metadata->'xmp', 'XMP-dc:Title') AND jsonb_exists(metadata->'xmp', 'XMP-dc:Subject')") === 1,
              'embedded XMP keyword list preserved' => (int) $db->fetchOne("SELECT COUNT(*) FROM media_assets WHERE original_filename = 'sample.jpg' AND jsonb_array_length(metadata->'xmp'->'XMP-dc:Subject') = 2") === 1,
              'IPTC fallback seeds canonical metadata' => (int) $db->fetchOne("SELECT COUNT(*) FROM media_assets WHERE original_filename = 'sample2.jpg' AND title = 'Aggregate Only Photo' AND description = 'Rating aggregate without detailed vote rows' AND creator = 'IPTC Creator' AND copyright = 'IPTC Copyright' AND location_name = 'IPTC Vienna' AND captured_at::date = DATE '2024-03-05'") === 1,
              'qualified IPTC snapshot keys' => (int) $db->fetchOne("SELECT COUNT(*) FROM media_assets WHERE original_filename = 'sample2.jpg' AND jsonb_exists(metadata->'iptc', 'IPTC:ObjectName') AND jsonb_exists(metadata->'iptc', 'IPTC:Keywords') AND jsonb_array_length(metadata->'iptc'->'IPTC:Keywords') = 2") === 1,
              'nested category hierarchy' => (int) $db->fetchOne("SELECT COUNT(*) FROM collections child JOIN collections parent ON parent.id = child.parent_id WHERE child.title = 'Nested Category' AND parent.title = 'Fixture Category'") === 1,
              'nested album hierarchy' => (int) $db->fetchOne("SELECT COUNT(*) FROM collections album JOIN collections parent ON parent.id = album.parent_id WHERE album.title = 'Nested Album' AND parent.title = 'Nested Category'") === 1,
              'user gallery root ownership' => (int) $db->fetchOne("SELECT COUNT(*) FROM collections c JOIN users u ON u.id = c.owner_id WHERE c.title = 'User Gallery Album' AND c.parent_id IS NULL AND u.username = 'fixture-user'") === 1,
              'restricted password-reset collection' => (int) $db->fetchOne("SELECT COUNT(*) FROM collections WHERE title = 'Fixture Album' AND visibility = 'restricted' AND password_protected = TRUE AND password_reset_required = TRUE") === 1,
              'category creation ACL' => (int) $db->fetchOne("SELECT COUNT(*) FROM collection_access ca JOIN collections c ON c.id = ca.collection_id JOIN groups g ON g.id = ca.group_id WHERE c.title = 'Fixture Category' AND g.name = 'Registered' AND ca.capability = 'collection.create_child' AND ca.effect = 'allow'") === 1,
              'group restricted ACL' => (int) $db->fetchOne("SELECT COUNT(*) FROM collection_access ca JOIN collections c ON c.id = ca.collection_id JOIN groups g ON g.id = ca.group_id WHERE c.title = 'Fixture Album' AND g.name = 'Registered' AND ca.capability = 'collection.view' AND ca.effect = 'allow'") === 1,
              'user restricted ACL' => (int) $db->fetchOne("SELECT COUNT(*) FROM collection_access ca JOIN collections c ON c.id = ca.collection_id JOIN users u ON u.id = ca.user_id WHERE c.title = 'User Restricted Album' AND u.username = 'viewer-user' AND ca.capability = 'collection.view' AND ca.effect = 'allow'") === 1,
              'tags' => (int) $db->fetchOne('SELECT COUNT(*) FROM tags') === 2,
              'album-keyword membership' => (int) $db->fetchOne("SELECT COUNT(*) FROM collection_media cm JOIN collections c ON c.id = cm.collection_id JOIN media_assets m ON m.id = cm.media_id WHERE c.title = 'Linked Album' AND m.original_filename = 'sample.jpg'") === 1,
              'comment' => (int) $db->fetchOne("SELECT COUNT(*) FROM comments WHERE body = 'Fixture comment'") === 1,
              'guest comment' => (int) $db->fetchOne("SELECT COUNT(*) FROM comments WHERE body = 'Guest fixture comment' AND user_id IS NULL AND guest_name = 'Guest Alice' AND moderation_state = 'pending_review'") === 1,
              'favorite' => (int) $db->fetchOne('SELECT COUNT(*) FROM favorites') === 1,
              'rating' => (int) $db->fetchOne('SELECT COUNT(*) FROM ratings WHERE value = 4') === 1,
              'aggregate-only rating' => (int) $db->fetchOne("SELECT COUNT(*) FROM import_rating_aggregates a JOIN media_assets m ON m.id = a.media_id WHERE m.original_filename = 'sample2.jpg' AND a.average_5 = 3 AND a.vote_count = 2") === 1,
              'no synthesized individual rating' => (int) $db->fetchOne("SELECT COUNT(*) FROM ratings r JOIN media_assets m ON m.id = r.media_id WHERE m.original_filename = 'sample2.jpg'") === 0,
              'reset-required user' => (int) $db->fetchOne("SELECT COUNT(*) FROM users WHERE username = 'fixture-user' AND status = 'password_reset_required'") === 1,
              'empty async queue' => (int) $db->fetchOne("SELECT COUNT(*) FROM messenger_messages WHERE queue_name = 'async'") === 0,
          ];

          foreach ($checks as $name => $ok) {
              echo ($ok ? 'OK ' : 'FAIL ').$name.PHP_EOL;
              if (!$ok) {
                  exit(1);
              }
          }
          PHP

      - name: Verify Coppermine migration preflight blockers
        run: |
          assert_inspect_blocked() {
            label="$1"
            expected="$2"
            output="/tmp/coppermine-preflight-${label}.txt"

            set +e
            php bin/console mediarama:import:coppermine:inspect >"$output" 2>&1
            status=$?
            set -e

            cat "$output"

            if [ "$status" -eq 0 ]; then
              echo "Expected preflight inspection to fail for: $label"
              exit 1
            fi

            grep -F "$expected" "$output"
          }

          mariadb --host=127.0.0.1 --port=3306 --user=root --password=root coppermine \
            -e "INSERT INTO cpg_users (user_id, user_group, user_active, user_name, user_lastvisit, user_regdate, user_email, user_profile6) VALUES (99, 3, 'YES', 'duplicate-user', '2024-02-03 10:00:00', '2024-01-03 10:00:00', 'fixture@example.test', '');"
          assert_inspect_blocked duplicate-email 'Duplicate normalized email address "fixture@example.test" is used by 2 source users'
          mariadb --host=127.0.0.1 --port=3306 --user=root --password=root coppermine \
            -e "DELETE FROM cpg_users WHERE user_id = 99;"

          mariadb --host=127.0.0.1 --port=3306 --user=root --password=root coppermine \
            -e "UPDATE cpg_config SET value = '1' WHERE name = 'bridge_enable';"
          assert_inspect_blocked bridge-enabled 'Coppermine bridging is enabled'
          mariadb --host=127.0.0.1 --port=3306 --user=root --password=root coppermine \
            -e "UPDATE cpg_config SET value = '0' WHERE name = 'bridge_enable';"

          mariadb --host=127.0.0.1 --port=3306 --user=root --password=root coppermine \
            -e "UPDATE cpg_albums SET moderator_group = 3 WHERE aid = 10;"
          assert_inspect_blocked moderator-group 'Album 10 has legacy moderator_group=3'
          mariadb --host=127.0.0.1 --port=3306 --user=root --password=root coppermine \
            -e "UPDATE cpg_albums SET moderator_group = 0 WHERE aid = 10;"

          mv /tmp/coppermine-albums/userpics/sample.jpg /tmp/coppermine-albums/userpics/sample.jpg.missing
          assert_inspect_blocked missing-original 'Picture 100 original file is missing or unreadable.'
          mv /tmp/coppermine-albums/userpics/sample.jpg.missing /tmp/coppermine-albums/userpics/sample.jpg

          cp /tmp/coppermine-albums/userpics/sample.jpg /tmp/coppermine-albums/userpics/sample.jpg.good
          printf 'not a jpeg\n' > /tmp/coppermine-albums/userpics/sample.jpg
          assert_inspect_blocked deceptive-extension 'Picture 100 source media is not importable: MIME type "text/plain" is not allowed for upload.'
          mv /tmp/coppermine-albums/userpics/sample.jpg.good /tmp/coppermine-albums/userpics/sample.jpg

          cp /tmp/coppermine-albums/userpics/sample.jpg /tmp/coppermine-albums/userpics/sample.jpg.good
          head -c 100 /tmp/coppermine-albums/userpics/sample.jpg.good > /tmp/coppermine-albums/userpics/sample.jpg
          php -r '$mime=(new finfo(FILEINFO_MIME_TYPE))->file($argv[1]); if ($mime !== "image/jpeg") { fwrite(STDERR, "Expected truncated fixture to remain image/jpeg, got ".$mime.PHP_EOL); exit(1); }' /tmp/coppermine-albums/userpics/sample.jpg
          assert_inspect_blocked corrupt-image 'Picture 100 source media is not importable: Unable to inspect image geometry:'
          mv /tmp/coppermine-albums/userpics/sample.jpg.good /tmp/coppermine-albums/userpics/sample.jpg

      - name: Verify unusual Coppermine prefix and configuration
        run: |
          php -r '
          $pdo = new PDO("pgsql:host=127.0.0.1;port=5432;dbname=postgres", "mediarama", "mediarama", [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);
          $pdo->exec("DROP DATABASE IF EXISTS mediarama_prefix");
          $pdo->exec("CREATE DATABASE mediarama_prefix");
          '

          mariadb --host=127.0.0.1 --port=3306 --user=root --password=root             -e "DROP DATABASE IF EXISTS coppermine_prefix; CREATE DATABASE coppermine_prefix CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          sed 's/cpg_/odd42__/g' tests/Fixtures/Coppermine/1.6-minimal.sql             | mariadb --host=127.0.0.1 --port=3306 --user=root --password=root coppermine_prefix
          mariadb --host=127.0.0.1 --port=3306 --user=root --password=root coppermine_prefix             -e "UPDATE odd42__config SET value = '|' WHERE name = 'keyword_separator'; UPDATE odd42__config SET value = '10' WHERE name = 'rating_stars_amount'; UPDATE odd42__pictures SET keywords = 'summer|vacation' WHERE pid = 100; UPDATE odd42__vote_stats SET rating = 8 WHERE sid = 300;"
          mariadb --host=127.0.0.1 --port=3306 --user=root --password=root             -e "GRANT SELECT ON coppermine_prefix.* TO 'readonly'@'%'; FLUSH PRIVILEGES;"

          export DATABASE_URL="postgresql://mediarama:mediarama@127.0.0.1:5432/mediarama_prefix?serverVersion=18&charset=utf8"
          export MEDIA_STORAGE_PATH="/tmp/mediarama-prefix-media"
          export COPPERMINE_DATABASE_URL="mysql://readonly:readonly@127.0.0.1:3306/coppermine_prefix"
          export COPPERMINE_TABLE_PREFIX="odd42__"

          php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
          php bin/console mediarama:import:coppermine:inspect | tee /tmp/coppermine-prefix-inspect.txt
          grep -F "Detected: 1.6.x-compatible" /tmp/coppermine-prefix-inspect.txt
          grep -F "pictures: 4" /tmp/coppermine-prefix-inspect.txt

          php bin/console mediarama:import:coppermine
          php bin/console messenger:consume async --limit=4 --time-limit=30 --no-interaction -vv

          php <<'PHP'
          <?php
          require 'vendor/autoload.php';

          $dsn = new Doctrine\DBAL\Tools\DsnParser([
              'postgresql' => 'pdo_pgsql',
              'postgres' => 'pdo_pgsql',
          ]);
          $db = Doctrine\DBAL\DriverManager::getConnection($dsn->parse((string) getenv('DATABASE_URL')));
          $checks = [
              'completed prefixed import' => (int) $db->fetchOne("SELECT COUNT(*) FROM import_runs WHERE source_type = 'coppermine' AND status = 'completed'") === 1,
              'prefixed media' => (int) $db->fetchOne('SELECT COUNT(*) FROM media_assets') === 4,
              'custom keyword separator' => (int) $db->fetchOne("SELECT COUNT(*) FROM tags WHERE slug IN ('summer', 'vacation')") === 2,
              'custom keyword links' => (int) $db->fetchOne("SELECT COUNT(*) FROM media_tags mt JOIN media_assets m ON m.id = mt.media_id JOIN tags t ON t.id = mt.tag_id WHERE m.original_filename = 'sample.jpg' AND t.slug IN ('summer', 'vacation')") === 2,
              'ten-star rating normalization' => (int) $db->fetchOne('SELECT COUNT(*) FROM ratings WHERE value = 4') === 1,
              'prefixed async queue drained' => (int) $db->fetchOne("SELECT COUNT(*) FROM messenger_messages WHERE queue_name = 'async'") === 0,
          ];

          foreach ($checks as $name => $ok) {
              echo ($ok ? 'OK ' : 'FAIL ').$name.PHP_EOL;
              if (!$ok) {
                  exit(1);
              }
          }
          PHP

      - name: Verify meaningful Coppermine 1.7 migration sample
        run: |
          php -r '
          $pdo = new PDO("pgsql:host=127.0.0.1;port=5432;dbname=postgres", "mediarama", "mediarama", [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);
          $pdo->exec("DROP DATABASE IF EXISTS mediarama17");
          $pdo->exec("CREATE DATABASE mediarama17");
          '

          mariadb --host=127.0.0.1 --port=3306 --user=root --password=root             -e "DROP DATABASE IF EXISTS coppermine17; CREATE DATABASE coppermine17 CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          mariadb --host=127.0.0.1 --port=3306 --user=root --password=root coppermine17             < tests/Fixtures/Coppermine/1.6-minimal.sql
          mariadb --host=127.0.0.1 --port=3306 --user=root --password=root coppermine17             < tests/Fixtures/Coppermine/1.7-variation.sql
          mariadb --host=127.0.0.1 --port=3306 --user=root --password=root             -e "GRANT SELECT ON coppermine17.* TO 'readonly'@'%'; FLUSH PRIVILEGES;"

          mkdir -p /tmp/coppermine17-albums/userpics
          cp /tmp/coppermine-albums/userpics/sample.jpg /tmp/coppermine17-albums/userpics/sample.jpg
          cp /tmp/coppermine-albums/userpics/sample2.jpg /tmp/coppermine17-albums/userpics/sample2.jpg
          cp /tmp/coppermine-albums/userpics/sample.mp3 /tmp/coppermine17-albums/userpics/sample.mp3
          cp /tmp/coppermine-albums/userpics/sample.mp4 /tmp/coppermine17-albums/userpics/sample.mp4
          convert -size 2x2 xc:white /tmp/coppermine17-albums/userpics/sample.webp

          export DATABASE_URL="postgresql://mediarama:mediarama@127.0.0.1:5432/mediarama17?serverVersion=18&charset=utf8"
          export MEDIA_STORAGE_PATH="/tmp/mediarama17-media"
          export COPPERMINE_DATABASE_URL="mysql://readonly:readonly@127.0.0.1:3306/coppermine17"
          export COPPERMINE_TABLE_PREFIX="cpg_"
          export COPPERMINE_ALBUMS_ROOT="/tmp/coppermine17-albums"

          php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
          php bin/console mediarama:import:coppermine:inspect | tee /tmp/coppermine17-inspect.txt
          grep -F "Detected: 1.7.x-compatible" /tmp/coppermine17-inspect.txt
          grep -F "pictures: 5" /tmp/coppermine17-inspect.txt

          php bin/console mediarama:import:coppermine
          php bin/console messenger:consume async --limit=5 --time-limit=30 --no-interaction -vv

          php <<'PHP'
          <?php
          require 'vendor/autoload.php';

          $dsn = new Doctrine\DBAL\Tools\DsnParser([
              'postgresql' => 'pdo_pgsql',
              'postgres' => 'pdo_pgsql',
          ]);
          $db = Doctrine\DBAL\DriverManager::getConnection($dsn->parse((string) getenv('DATABASE_URL')));
          $checks = [
              'completed 1.7 import' => (int) $db->fetchOne("SELECT COUNT(*) FROM import_runs WHERE source_type = 'coppermine' AND source_version = '1.7.x-compatible' AND status = 'completed'") === 1,
              'five migrated 1.7 media' => (int) $db->fetchOne('SELECT COUNT(*) FROM media_assets') === 5,
              '1.7 WebP ready' => (int) $db->fetchOne("SELECT COUNT(*) FROM media_assets WHERE original_filename = 'sample.webp' AND mime_type = 'image/webp' AND media_type = 'image' AND processing_state = 'ready'") === 1,
              '1.7 audio ready' => (int) $db->fetchOne("SELECT COUNT(*) FROM media_assets WHERE original_filename = 'sample.mp3' AND mime_type = 'audio/mpeg' AND media_type = 'audio' AND processing_state = 'ready'") === 1,
              '1.7 video ready' => (int) $db->fetchOne("SELECT COUNT(*) FROM media_assets WHERE original_filename = 'sample.mp4' AND mime_type = 'video/mp4' AND media_type = 'video' AND processing_state = 'ready'") === 1,
              '1.7 async queue drained' => (int) $db->fetchOne("SELECT COUNT(*) FROM messenger_messages WHERE queue_name = 'async'") === 0,
