parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    Mediarama\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'


    Mediarama\Media\Infrastructure\Metadata\ExifToolProcess:
        arguments:
            $binary: '%env(default:exiftool:EXIFTOOL_BINARY)%'

    Mediarama\Media\Infrastructure\Metadata\LocalExifToolInspector:
        arguments:
            $mediaRoot: '%env(resolve:MEDIA_STORAGE_PATH)%'

    Mediarama\Media\Application\MediaMetadataInspector:
        alias: Mediarama\Media\Infrastructure\Metadata\LocalExifToolInspector

    Mediarama\Export\Application\MetadataWriter:
        alias: Mediarama\Export\Infrastructure\ExifToolMetadataWriter


    Mediarama\Upload\Application\UploadSessionRepository:
        alias: Mediarama\Upload\Infrastructure\Persistence\DbalUploadSessionRepository

    Mediarama\Media\Application\MediaAssetRepository:
        alias: Mediarama\Media\Infrastructure\Persistence\DbalMediaAssetRepository

    Mediarama\Media\Infrastructure\Storage\LocalMediaStorage:
        arguments:
            $mediaRoot: '%env(resolve:MEDIA_STORAGE_PATH)%'

    Mediarama\Media\Application\MediaStorage:
        alias: Mediarama\Media\Infrastructure\Storage\LocalMediaStorage


    Mediarama\Upload\Application\ContentInspector:
        alias: Mediarama\Upload\Infrastructure\LocalContentInspector


    Mediarama\Collection\Application\CollectionUploadPermissionRepository:
        alias: Mediarama\Collection\Infrastructure\Persistence\DbalCollectionUploadPermissionRepository

    Mediarama\Upload\Application\UploadDestinationAuthorizer:
        alias: Mediarama\Upload\Infrastructure\Authorization\CollectionUploadDestinationAuthorizer

    Mediarama\Upload\Application\UploadQuota:
        alias: Mediarama\Upload\Application\UnlimitedUploadQuota

    Mediarama\Upload\Application\ChunkStorage:
        alias: Mediarama\Upload\Infrastructure\Storage\LocalChunkStorage

    Mediarama\Upload\Infrastructure\Storage\LocalChunkStorage:
        arguments:
            $mediaRoot: '%env(resolve:MEDIA_STORAGE_PATH)%'

    Mediarama\Upload\Application\UploadPolicy:
        arguments:
            $maximumAssetBytes: '%env(int:UPLOAD_MAX_ASSET_BYTES)%'
            $maximumChunkBytes: '%env(int:UPLOAD_MAX_CHUNK_BYTES)%'


    Mediarama\Upload\Application\UploadFinalizationRepository:
        alias: Mediarama\Upload\Infrastructure\Persistence\DbalUploadFinalizationRepository

    Mediarama\Upload\Application\UploadContentPolicy:
        arguments:
            $allowedMimeTypes:
                - 'image/jpeg'
                - 'image/png'
                - 'image/gif'
                - 'image/webp'
                - 'image/tiff'
                - 'image/avif'
                - 'image/heic'
                - 'image/heif'
                - 'video/mp4'
                - 'video/quicktime'
                - 'video/webm'
                - 'audio/mpeg'
                - 'audio/mp4'
                - 'audio/ogg'
                - 'audio/flac'
